[package]
name = "jumpring"
version = "2.0.4"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "elden_force_prepare"
path = "src/bin/prepare.rs"

[[bin]]
name = "ccw_survey"
path = "src/bin/ccw_survey.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
eldenring = { path = "../../tools/fromsoftware-rs/crates/eldenring" }
fromsoftware-shared = { path = "../../tools/fromsoftware-rs/crates/shared" }
hudhook = { version = "0.9.3", default-features = false, features = ["dx12", "inject"] }
num-bigint = "0.5.1"
png = "0.17"
rand = "0.10.3"
retour = "0.3.1"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "vorbis"] }
texpresso = "2"
texture2ddecoder = "0.1.2"
tracing = "0.1.44"
from-singleton = "3.0.1"
pelite = "0.10"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_Devices_HumanInterfaceDevice", "Win32_UI_Input_XboxController", "Win32_System_Com", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Registry"] }

[profile.release]
panic = "abort"
lto = "thin"

[build-dependencies]
serde_json = "1.0.151"

[features]
lab = []
